openapi: 3.1.0
info:
  title: Auctions API
  version: 1.0.0
  description: A comprehensive API for managing auctions, users, and authentication
  contact:
    name: API Support
    email: support@auctions-api.com

servers:
  - url: http://localhost:8090
    description: Development server
  - url: https://api.auctions.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: The user ID
        email:
          type: string
          format: email
          description: The user's email address
        emailVerified:
          type: boolean
          description: Whether the user's email is verified
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: When the user's email was verified

    CreateUser:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The user's email address
        password:
          type: string
          minLength: 8
          description: The user's password (minimum 8 characters)
        emailVerified:
          type: boolean
          description: Whether the user's email is verified (optional)
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: When the user's email was verified (optional)

    UpdateUser:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The user's email address
        password:
          type: string
          minLength: 8
          description: The user's password (minimum 8 characters)
        emailVerified:
          type: boolean
          description: Whether the user's email is verified
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: When the user's email was verified

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The user's email address
        password:
          type: string
          description: The user's password

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The user's email address

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Password reset token
        password:
          type: string
          minLength: 8
          description: New password (minimum 8 characters)

    EmailVerificationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Email verification token

    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: User's email address

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        message:
          type: string
          description: Response message
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            accessToken:
              type: string
              description: JWT access token

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        message:
          type: string
          description: Response message
        data:
          type: object
          description: Response data

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
          description: Whether the request was successful
        data:
          nullable: true
          example: null
          description: Response data (null for errors)
        message:
          oneOf:
            - type: string
              description: Simple error message
            - type: array
              items:
                type: object
                properties:
                  message:
                    type: string
                    description: Validation error message
              description: Array of validation error messages

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: healthy
          description: Health status of the API

    Product:
      type: object
      properties:
        id:
          type: integer
          description: The product ID
        name:
          type: string
          description: The product name
        description:
          type: string
          description: The product description
        startingPrice:
          type: number
          format: float
          description: Starting bid price
        currentPrice:
          type: number
          format: float
          description: Current highest bid
        endDate:
          type: string
          format: date-time
          description: Auction end date
        createdAt:
          type: string
          format: date-time
          description: When the product was created
        updatedAt:
          type: string
          format: date-time
          description: When the product was last updated

    Role:
      type: object
      properties:
        id:
          type: integer
          description: The role ID
        name:
          type: string
          description: The role name
        created_at:
          type: string
          format: date-time
          description: When the role was created
        updated_at:
          type: string
          format: date-time
          description: When the role was last updated

    RoleWithPermissions:
      allOf:
        - $ref: "#/components/schemas/Role"
        - type: object
          properties:
            permissions:
              type: array
              items:
                $ref: "#/components/schemas/Permission"
              description: Permissions assigned to this role

    Permission:
      type: object
      properties:
        id:
          type: integer
          description: The permission ID
        name:
          type: string
          description: The permission name
        description:
          type: string
          nullable: true
          description: The permission description
        created_at:
          type: string
          format: date-time
          description: When the permission was created
        updated_at:
          type: string
          format: date-time
          description: When the permission was last updated

    CreateRole:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The role name

    UpdateRole:
      type: object
      properties:
        name:
          type: string
          description: The role name

    CreatePermission:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The permission name
        description:
          type: string
          description: The permission description

    UpdatePermission:
      type: object
      properties:
        name:
          type: string
          description: The permission name
        description:
          type: string
          description: The permission description

    AssignUserRoles:
      type: object
      required:
        - role_ids
      properties:
        role_ids:
          type: array
          items:
            type: integer
          description: Array of role IDs to assign to the user

    AssignRolePermission:
      type: object
      required:
        - permission_id
      properties:
        permission_id:
          type: integer
          description: Permission ID to assign to the role

    SetRolePermissions:
      type: object
      required:
        - permission_ids
      properties:
        permission_ids:
          type: array
          items:
            type: integer
          description: Array of permission IDs to set for the role

    CreateProduct:
      type: object
      required:
        - name
        - description
        - startingPrice
        - endDate
      properties:
        name:
          type: string
          description: The product name
        description:
          type: string
          description: The product description
        startingPrice:
          type: number
          format: float
          description: Starting bid price
        endDate:
          type: string
          format: date-time
          description: Auction end date

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Users
    description: User management endpoints
  - name: Products
    description: Product management endpoints
  - name: Roles
    description: Role management endpoints (Admin only)
  - name: Permissions
    description: Permission management endpoints (Admin only)
  - name: System
    description: System health and status endpoints

paths:
  /api/v1/status:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      tags:
        - System
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: healthy

  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: Create a new user account
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  summary: Validation error example
                  value:
                    success: false
                    data: null
                    message:
                      - message: "body.email is Invalid email format"
                      - message: "body.password is Password must be at least 8 characters"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticate user and return access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: Refresh token cookie
              schema:
                type: string
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: Get a new access token using refresh token
      tags:
        - Authentication
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Successfully refreshed token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many refresh attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/revoke:
    post:
      summary: Revoke refresh token
      description: Invalidate the current refresh token
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token successfully revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      summary: User logout
      description: Logout user and clear refresh token
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset
      description: Send password reset email to user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/reset-password:
    post:
      summary: Reset password
      description: Reset user password using reset token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password successfully reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid token or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/verify-email:
    post:
      summary: Verify email address
      description: Verify user's email address using verification token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "200":
          description: Email successfully verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/resend-verification:
    post:
      summary: Resend verification email
      description: Send a new email verification token to user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users:
    get:
      summary: Get all users
      description: Retrieve a list of all users (requires authentication)
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully retrieved users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Create a new user
      description: Create a new user (requires authentication)
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}:
    get:
      summary: Get user by ID
      description: Retrieve a specific user by their ID (requires authentication)
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The user ID
      responses:
        "200":
          description: Successfully retrieved user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update user
      description: Update a specific user by their ID (requires authentication)
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        "200":
          description: User successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid input data or user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete user
      description: Delete a specific user by their ID (requires authentication)
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The user ID
      responses:
        "200":
          description: User successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/products:
    get:
      summary: Get all products
      description: Retrieve a list of all products
      tags:
        - Products
      responses:
        "200":
          description: Successfully retrieved products
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"

    post:
      summary: Create a new product
      description: Create a new product in the system
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        "201":
          description: Product successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/products/{id}:
    get:
      summary: Get product by ID
      description: Retrieve a specific product by its ID
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The product ID
      responses:
        "200":
          description: Successfully retrieved product
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update product
      description: Update a specific product by its ID
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        "200":
          description: Product successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete product
      description: Delete a specific product by its ID
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The product ID
      responses:
        "200":
          description: Product successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Role Management Endpoints
  /api/v1/roles:
    get:
      summary: Get all roles
      description: Retrieve all roles, optionally with their permissions
      tags:
        - Roles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: include_permissions
          schema:
            type: boolean
            default: false
          description: Include permissions in the response
      responses:
        "200":
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Roles retrieved successfully"
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/Role"
                        - $ref: "#/components/schemas/RoleWithPermissions"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Create a new role
      description: Create a new role (Admin only)
      tags:
        - Roles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRole"
      responses:
        "201":
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Role created successfully"
                  data:
                    $ref: "#/components/schemas/Role"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Role already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Permission Management Endpoints
  /api/v1/permissions:
    get:
      summary: Get all permissions
      description: Retrieve all permissions (Admin only)
      tags:
        - Permissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
